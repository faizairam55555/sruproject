<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <style>
        /* Remove default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page background */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Welcome box */
        .welcome-box {
            background-color: white;
            width: 450px;
            padding: 50px;
            text-align: center;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Heading */
        .welcome-box h1 {
            color: #333;
            font-size: 40px;
            margin-bottom: 15px;
        }

        /* Paragraph */
        .welcome-box p {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;

            transition: 0.3s;
        }

        /* Button hover effect */
        .btn:hover {
            background-color: #764ba2;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <h1>Welcome!</h1>
