```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        /* Remove default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page background */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login box */
        .login-box {
            width: 350px;
            background-color: white;
            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Heading */
        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Labels */
        .login-box label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        /* Input fields */
        .login-box input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;
        }

        /* Input focus effect */
        .login-box input:focus {
            border-color: #667eea;
            outline: none;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 5px;

            background-color: #667eea;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        /* Button hover */
        .login-btn:hover {
            background-color: #764ba2;
        }

        /* Register text */
        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #667eea;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <label for="username">Username</label>
            <input 
                type="text" 
                id="username" 
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="#">Register</a>
        </div>

    </div>

</body>
</html>
```
